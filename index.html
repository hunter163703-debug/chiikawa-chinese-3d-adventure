<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>吉伊卡哇 3D 冒險拯救大作戰：探索萌島與生字語詞書寫</title>
  <!-- Google Fonts: Zen Maru Gothic & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- Three.js for 3D Game World -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Canvas Confetti for Celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --chiikawa-pink: #ffb8d1;
      --chiikawa-pink-dark: #f089ac;
      --chiikawa-pink-light: #ffe6ef;
      --hachiware-blue: #89cff0;
      --hachiware-blue-dark: #58b2e3;
      --hachiware-blue-light: #e5f5fd;
      --usagi-yellow: #fff59d;
      --usagi-yellow-dark: #f6e05e;
      --usagi-yellow-light: #fffae0;
      --soft-brown: #5d4037;
      --soft-brown-light: #8d6e63;
      --success-green: #77dd77;
      --success-green-dark: #5cb85c;
      --error-red: #ff6961;
      --cream-bg: #fffdf9;
      --card-bg: #ffffff;
      --shadow-soft-pink: 0 10px 25px rgba(255, 184, 209, 0.45);
      --shadow-soft-blue: 0 10px 25px rgba(137, 207, 240, 0.4);
      --shadow-marshmallow: 0 8px 20px rgba(93, 64, 55, 0.12);
      --font-cute: 'Zen Maru Gothic', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: var(--font-cute);
      color: var(--soft-brown);
      background-color: #fff9fb;
      background-image: 
        radial-gradient(#ffccd9 15%, transparent 16%),
        radial-gradient(#d0e8f7 15%, transparent 16%);
      background-size: 36px 36px;
      background-position: 0 0, 18px 18px;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 頂部導航列 */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .header-left, .header-center, .header-right {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cute-pill-btn {
      background: #ffffff;
      border: 3px solid var(--chiikawa-pink);
      color: var(--soft-brown);
      font-family: var(--font-cute);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 8px 16px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: var(--shadow-marshmallow);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .cute-pill-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: var(--shadow-soft-pink);
    }
    .cute-pill-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .cute-select-wrapper {
      position: relative;
    }
    .cute-select {
      appearance: none;
      background: #ffffff;
      border: 3px solid var(--hachiware-blue);
      color: var(--soft-brown);
      font-family: var(--font-cute);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 8px 36px 8px 16px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: var(--shadow-marshmallow);
      outline: none;
      transition: all 0.2s ease;
    }
    .cute-select:hover {
      border-color: var(--hachiware-blue-dark);
      box-shadow: var(--shadow-soft-blue);
    }
    .cute-select-arrow {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--hachiware-blue-dark);
      font-size: 0.8rem;
    }

    /* 鑰匙進度 HUD (隨機收集 5銀 + 5金) */
    .key-hud {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border: 3px solid var(--usagi-yellow-dark);
      border-radius: 40px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-marshmallow);
    }
    .key-group {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 900;
      font-size: 0.95rem;
    }
    .key-icons {
      display: flex;
      gap: 3px;
    }
    .key-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #e2e8f0;
      border: 2px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .key-dot.silver.active {
      background: #89cff0;
      border-color: #58b2e3;
      color: white;
      transform: scale(1.15);
      box-shadow: 0 0 8px rgba(137, 207, 240, 0.8);
    }
    .key-dot.gold.active {
      background: #ffd700;
      border-color: #f59e0b;
      color: white;
      transform: scale(1.15);
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
    }

    /* 3D 畫布容器 */
    #game-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* 底部浮動 HUD */
    .bottom-hud {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      z-index: 40;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 20px;
      pointer-events: none;
    }

    .touch-controls {
      pointer-events: auto;
      display: none;
    }
    @media (pointer: coarse) {
      .touch-controls { display: block; }
    }

    /* 虛擬搖桿 (Virtual Joystick) */
    .joystick-zone {
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.7);
      border: 3px solid var(--chiikawa-pink);
      border-radius: 50%;
      position: relative;
      touch-action: none;
      box-shadow: var(--shadow-soft-pink);
      backdrop-filter: blur(4px);
    }
    .joystick-knob {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, var(--chiikawa-pink), var(--chiikawa-pink-dark));
      border-radius: 50%;
      position: absolute;
      top: 35px;
      left: 35px;
      pointer-events: none;
      box-shadow: 0 4px 10px rgba(240, 137, 172, 0.5);
    }

    .hud-actions {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .action-big-btn {
      background: linear-gradient(135deg, var(--chiikawa-pink), #ff9ebf);
      color: #ffffff;
      border: 3px solid #ffffff;
      font-family: var(--font-cute);
      font-weight: 900;
      font-size: 1.1rem;
      padding: 14px 24px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 137, 172, 0.45);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: pulse-cute 2s infinite ease-in-out;
    }
    .action-big-btn:hover {
      transform: translateY(-3px) scale(1.05);
    }
    .action-big-btn:active {
      transform: translateY(2px) scale(0.96);
    }

    @keyframes pulse-cute {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .jump-btn {
      background: linear-gradient(135deg, var(--hachiware-blue), #64c2f3);
      color: white;
      border: 3px solid #ffffff;
      font-family: var(--font-cute);
      font-weight: 900;
      font-size: 0.95rem;
      padding: 10px 18px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(88, 178, 227, 0.35);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    /* 3D 浮動互動提示泡泡 */
    #interact-prompt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -100px);
      z-index: 45;
      background: #ffffff;
      border: 3px solid var(--chiikawa-pink);
      border-radius: 30px;
      padding: 10px 20px;
      font-weight: 900;
      font-size: 1.05rem;
      color: var(--soft-brown);
      box-shadow: var(--shadow-soft-pink);
      pointer-events: auto;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 8px;
      animation: float-bubble 1.5s infinite ease-in-out;
    }
    #interact-prompt::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: var(--chiikawa-pink) transparent;
      display: block;
      width: 0;
    }
    @keyframes float-bubble {
      0%, 100% { transform: translate(-50%, -100px); }
      50% { transform: translate(-50%, -110px); }
    }

    /* 任務挑戰彈窗 (雙模式 Tab Modal) */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(93, 64, 55, 0.45);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .modal-backdrop.show {
      display: flex;
      opacity: 1;
    }

    .challenge-card {
      background: #ffffff;
      width: 100%;
      max-width: 620px;
      max-height: 92vh;
      border-radius: 36px;
      border: 4px solid var(--chiikawa-pink);
      box-shadow: 0 20px 40px rgba(93, 64, 55, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-backdrop.show .challenge-card {
      transform: scale(1);
    }

    /* 彈窗頭部 */
    .modal-header {
      background: linear-gradient(135deg, var(--chiikawa-pink-light), var(--usagi-yellow-light));
      padding: 14px 20px;
      border-bottom: 3px solid var(--chiikawa-pink);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .quest-badge {
      background: linear-gradient(135deg, #ff9ebf, #f089ac);
      color: white;
      font-size: 0.85rem;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(240, 137, 172, 0.5);
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--soft-brown);
    }
    .modal-close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--chiikawa-pink);
      color: var(--soft-brown);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .modal-close-btn:hover {
      background: var(--chiikawa-pink);
      color: white;
      transform: rotate(90deg);
    }

    /* 題目情境卡 */
    .clue-context-box {
      background: var(--cream-bg);
      margin: 12px 18px 0;
      padding: 12px 16px;
      border-radius: 24px;
      border: 2px dashed var(--chiikawa-pink-dark);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .clue-icon {
      font-size: 1.8rem;
      line-height: 1;
    }
    .clue-text-wrapper {
      flex: 1;
    }
    .clue-target-word {
      font-size: 1.1rem;
      font-weight: 900;
      color: #d63384;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .clue-desc {
      font-size: 0.95rem;
      line-height: 1.45;
      color: var(--soft-brown);
    }
    .tts-speaker-btn {
      background: #ffffff;
      border: 2px solid var(--hachiware-blue);
      color: var(--hachiware-blue-dark);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      margin-left: 6px;
      transition: all 0.2s ease;
    }
    .tts-speaker-btn:hover {
      background: var(--hachiware-blue);
      color: white;
      transform: scale(1.1);
    }

    /* 模式切換 Tabs */
    .tab-bar {
      display: flex;
      gap: 8px;
      padding: 10px 18px 0;
    }
    .tab-btn {
      flex: 1;
      background: #f1f5f9;
      border: 2px solid #e2e8f0;
      color: var(--soft-brown-light);
      font-family: var(--font-cute);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 8px 12px;
      border-radius: 20px 20px 0 0;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tab-btn.active {
      background: #ffffff;
      border-color: var(--chiikawa-pink);
      border-bottom-color: transparent;
      color: var(--soft-brown);
      font-weight: 900;
      box-shadow: 0 -4px 10px rgba(255, 184, 209, 0.2);
    }

    .modal-body {
      padding: 14px 18px 18px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ✍️ 純淨米字格自主書寫模式 (無任何筆畫提示) */
    .writing-mode-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .canvas-container {
      position: relative;
      width: 250px;
      height: 250px;
      background: #ffffff;
      border: 3px solid var(--chiikawa-pink-dark);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow-marshmallow);
      touch-action: none;
    }
    /* 米字格背景 */
    .mizige-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #writing-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .canvas-toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    .tool-btn {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      color: var(--soft-brown);
      font-family: var(--font-cute);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .tool-btn:hover {
      border-color: var(--chiikawa-pink);
      background: var(--chiikawa-pink-light);
    }
    .tool-btn.active {
      background: var(--chiikawa-pink);
      border-color: var(--chiikawa-pink-dark);
      color: white;
    }

    /* 💡 提示與測驗模式內容 */
    .quiz-mode-view {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hints-accordion {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hint-chip {
      background: var(--usagi-yellow-light);
      border: 2px solid var(--usagi-yellow-dark);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--soft-brown);
    }
    .hint-chip-title {
      font-weight: 900;
      background: var(--usagi-yellow-dark);
      color: var(--soft-brown);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
    }

    /* 四選一選項卡 */
    .quiz-options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .option-card {
      background: #ffffff;
      border: 3px solid #e2e8f0;
      border-radius: 24px;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    .option-card:hover {
      border-color: var(--hachiware-blue);
      transform: translateY(-2px) scale(1.02);
      box-shadow: var(--shadow-soft-blue);
    }
    .option-char {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--soft-brown);
      line-height: 1;
    }
    .option-zhuyin {
      font-size: 0.85rem;
      color: var(--soft-brown-light);
    }
    .option-card.correct {
      background: #eafaf1 !important;
      border-color: var(--success-green) !important;
      color: var(--success-green-dark) !important;
      transform: scale(1.05);
    }
    .option-card.wrong {
      background: #fdf2f2 !important;
      border-color: var(--error-red) !important;
      animation: shake 0.4s ease-in-out;
    }

    /* 打字輸入區 */
    .typing-section {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 24px;
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .typing-input {
      flex: 1;
      background: #ffffff;
      border: 2px solid var(--hachiware-blue);
      border-radius: 20px;
      padding: 8px 14px;
      font-family: var(--font-cute);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--soft-brown);
      outline: none;
    }
    .typing-input:focus {
      border-color: var(--hachiware-blue-dark);
      box-shadow: 0 0 0 3px rgba(137, 207, 240, 0.3);
    }

    /* 提交確認按鈕 */
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--usagi-yellow), var(--usagi-yellow-dark));
      border: 3px solid #ffffff;
      color: var(--soft-brown);
      font-family: var(--font-cute);
      font-weight: 900;
      font-size: 1.1rem;
      padding: 12px 20px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(246, 224, 94, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .submit-btn:hover {
      transform: translateY(-2px) scale(1.02);
    }
    .submit-btn:active {
      transform: translateY(1px);
    }

    /* 正向回饋橫幅 (Feedback Toast) */
    #feedback-toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      z-index: 200;
      background: #ffffff;
      border: 4px solid var(--success-green);
      border-radius: 40px;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 15px 35px rgba(119, 221, 119, 0.4);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      opacity: 0;
      pointer-events: none;
    }
    #feedback-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .feedback-icon {
      font-size: 2rem;
      animation: spin-celebrate 0.8s ease;
    }
    .feedback-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--success-green-dark);
    }
    .feedback-sub {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--soft-brown);
    }

    @keyframes spin-celebrate {
      0% { transform: scale(0) rotate(-180deg); }
      70% { transform: scale(1.25) rotate(15deg); }
      100% { transform: scale(1) rotate(0); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* 大通關榮譽證書彈窗 (Certificate Modal) */
    .victory-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(93, 64, 55, 0.6);
      backdrop-filter: blur(8px);
      z-index: 150;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .victory-modal.show {
      display: flex;
    }
    .certificate-card {
      background: #ffffff;
      width: 100%;
      max-width: 640px;
      border-radius: 40px;

    /* -------------------------------------------------------------
       4. Web Audio API 音效引擎 (零外部依賴)
    ------------------------------------------------------------- */
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 正確音效：清脆雙音階 (C5 -> G5)
    function playDingDongSound() {
      if (isMuted) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const gain1 = audioCtx.createGain();
      osc1.type = 'triangle';
      osc1.frequency.setValueAtTime(523.25, now);
      gain1.gain.setValueAtTime(0.25, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc1.connect(gain1);
      gain1.connect(audioCtx.destination);
      osc1.start(now);
      osc1.stop(now + 0.25);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(783.99, now + 0.12);
      gain2.gain.setValueAtTime(0.3, now + 0.12);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
      osc2.connect(gain2);
      gain2.connect(audioCtx.destination);
      osc2.start(now + 0.12);
      osc2.stop(now + 0.55);
    }

    // 獲得鑰匙琶音音效 (C5 -> E5 -> G5 -> C6)
    function playKeyPickupSound() {
      if (isMuted) return;
      initAudio();
      if (!audioCtx) return;

      const notes = [523.25, 659.25, 783.99, 1046.50];
      const now = audioCtx.currentTime;
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
        gain.gain.setValueAtTime(0.2, now + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.08);
        osc.stop(now + idx * 0.08 + 0.3);
      });
    }

    // 牢籠開啟震撼破關號角
    function playVictoryFanfare() {
      if (isMuted) return;
      initAudio();
      if (!audioCtx) return;

      const chords = [
        { freq: 523.25, time: 0 },
        { freq: 659.25, time: 0.1 },
        { freq: 783.99, time: 0.2 },
        { freq: 1046.50, time: 0.35 }
      ];
      const now = audioCtx.currentTime;
      chords.forEach(c => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(c.freq, now + c.time);
        gain.gain.setValueAtTime(0.25, now + c.time);
        gain.gain.exponentialRampToValueAtTime(0.001, now + c.time + 0.8);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + c.time);
        osc.stop(now + c.time + 0.8);
      });
    }

    // 答錯輕微提示音
    function playWrongSound() {
      if (isMuted) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.linearRampToValueAtTime(160, now + 0.25);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    }

    /* -------------------------------------------------------------
       5. Web SpeechSynthesis TTS 語音朗讀系統
    ------------------------------------------------------------- */
    function speakText(text, callback) {
      if (isMuted) {
        if (callback) callback();
        return;
      }
      if (!('speechSynthesis' in window)) {
        if (callback) callback();
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.rate = 0.95;
      utterance.pitch = 1.15;

      const voices = window.speechSynthesis.getVoices();
      const twVoice = voices.find(v => v.lang.includes('TW') || v.lang.includes('zh-TW'));
      if (twVoice) utterance.voice = twVoice;

      if (callback) {
        utterance.onend = callback;
        utterance.onerror = callback;
      }
      window.speechSynthesis.speak(utterance);
    }

    function toggleMute() {
      isMuted = !isMuted;
      const icon = document.getElementById('mute-icon');
      const text = document.getElementById('mute-text');
      if (isMuted) {
        icon.innerText = '🔕';
        text.innerText = '已靜音';
        window.speechSynthesis.cancel();
      } else {
        icon.innerText = '🔔';
        text.innerText = '聲音開啟';
        initAudio();
        speakText('聲音已開啟');
      }
    }

    /* 手繪畫布 Canvas 筆刷與橡皮擦實作 */
    const canvas = document.getElementById('writing-canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let brushColor = '#d63384';
    let brushWidth = 8;
    let isEraserMode = false;
    let hasDrawnStrokes = false;

    function initCanvas() {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      function startDraw(e) {
        isDrawing = true;
        hasDrawnStrokes = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }

      function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        if (isEraserMode) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 20;
        } else {
          ctx.strokeStyle = brushColor;
          ctx.lineWidth = brushWidth;
        }
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      }

      function endDraw() {
        isDrawing = false;
      }

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', draw);
      window.addEventListener('mouseup', endDraw);

      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', draw, { passive: false });
      window.addEventListener('touchend', endDraw);
    }

    function setBrushColor(color) {
      isEraserMode = false;
      brushColor = color;
      brushWidth = 8;
      document.querySelectorAll('.canvas-toolbar .tool-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      if (color === '#d63384') document.getElementById('brush-color-pink').classList.add('active');
      else if (color === '#0284c7') document.getElementById('brush-color-blue').classList.add('active');
      else document.getElementById('brush-color-black').classList.add('active');
    }

    function setEraser() {
      isEraserMode = true;
      document.querySelectorAll('.canvas-toolbar .tool-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.getElementById('brush-eraser').classList.add('active');
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasDrawnStrokes = false;
    }

    function submitWriting() {
      if (!hasDrawnStrokes) {
        speakText('請先在米字格上練習寫出這個字喔！');
        return;
      }
      triggerCorrectRewardSequence();
    }

    function setupQuizOptions(q) {
      const container = document.getElementById('quiz-options-container');
      container.innerHTML = '';
      
      const options = [
        { char: q.char, zhuyin: q.zhuyin, isCorrect: true },
        ...q.distractors.map(d => ({ char: d, zhuyin: '', isCorrect: false }))
      ];
      options.sort(() => 0.5 - Math.random());

      options.forEach(opt => {
        const card = document.createElement('div');
        card.className = 'option-card';
        card.innerHTML = `
          <div class="option-char">${opt.char}</div>
          <div class="option-zhuyin">${opt.zhuyin || '　'}</div>
        `;
        card.onclick = () => {
          if (opt.isCorrect) {
            card.classList.add('correct');
            triggerCorrectRewardSequence();
          } else {
            card.classList.add('wrong');
            playWrongSound();
            speakText('再想想看喔，注意看部首提示！');
            setTimeout(() => card.classList.remove('wrong'), 600);
          }
        };
        container.appendChild(card);
      });
    }

    function submitTyping() {
      const input = document.getElementById('type-input');
      const val = input.value.trim();
      const q = currentQuestions[activeItemIndex % currentQuestions.length];
      if (!val) return;

      if (val === q.char || val === q.word) {
        triggerCorrectRewardSequence();
      } else {
        playWrongSound();
        speakText('差一點點，再檢查一下國字喔！');
        input.style.borderColor = 'var(--error-red)';
        setTimeout(() => input.style.borderColor = 'var(--hachiware-blue)', 1000);
      }
    }

    function init3DWorld() {

    function buildIslandTerrain() {

        const stoneMat = new THREE.MeshLambertMaterial({ color: 0xffffff });

        const candidate = (activeItemIndex + i + 1) % MAP_ITEMS_CONFIG.length;
        if (!clearedItems.has(candidate)) {
          nextIdx = candidate;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let targetPos = null;

    function onPointerDown(e) {
      if (isModalOpen) return;
      if (e.target.closest('.bottom-hud') || e.target.closest('header')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(scene.children, true);

      if (intersects.length > 0) {
        const p = intersects[0].point;
        targetPos = new THREE.Vector3(p.x, 0, p.z);
      }
    }

    function initJoystick() {
      const zone = document.getElementById('joystick-zone');
      const knob = document.getElementById('joystick-knob');
      let activeTouchId = null;
      let startPos = { x: 0, y: 0 };

      zone.addEventListener('touchstart', e => {
        const touch = e.touches[0];
        activeTouchId = touch.identifier;
        const rect = zone.getBoundingClientRect();
        startPos = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
        handleMove(touch);
      }, { passive: false });

      zone.addEventListener('touchmove', e => {
        for (let i = 0; i < e.touches.length; i++) {
          if (e.touches[i].identifier === activeTouchId) {
            handleMove(e.touches[i]);
            break;
          }
        }
      }, { passive: false });

      function endTouch() {
        activeTouchId = null;
        joystickVector = { x: 0, y: 0 };
        knob.style.transform = `translate(0px, 0px)`;
      }

      zone.addEventListener('touchend', endTouch);
      zone.addEventListener('touchcancel', endTouch);

      function handleMove(touch) {
        const dx = touch.clientX - startPos.x;
        const dy = touch.clientY - startPos.y;
        const dist = Math.min(45, Math.hypot(dx, dy));
        const angle = Math.atan2(dy, dx);

        const kx = Math.cos(angle) * dist;
        const ky = Math.sin(angle) * dist;
        knob.style.transform = `translate(${kx}px, ${ky}px)`;

        joystickVector = {
          x: kx / 45,
          y: ky / 45
        };
      }
    }

    let clock = new THREE.Clock();
    let walkCycle = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (chiikawaGroup && !isModalOpen) {
        let moveX = 0;
        let moveZ = 0;

        if (keysPressed['w'] || keysPressed['arrowup']) moveZ -= 1;
        if (keysPressed['s'] || keysPressed['arrowdown']) moveZ += 1;
        if (keysPressed['a'] || keysPressed['arrowleft']) moveX -= 1;
        if (keysPressed['d'] || keysPressed['arrowright']) moveX += 1;

        if (Math.abs(joystickVector.x) > 0.1 || Math.abs(joystickVector.y) > 0.1) {
          moveX = joystickVector.x;
          moveZ = joystickVector.y;
          targetPos = null;
        }

        if (targetPos) {
          const toTarget = new THREE.Vector3().subVectors(targetPos, chiikawaGroup.position);
          toTarget.y = 0;
          if (toTarget.length() > 0.2) {
            toTarget.normalize();
            moveX = toTarget.x;
            moveZ = toTarget.z;
          } else {
            targetPos = null;
          }
        }

        const isMoving = Math.abs(moveX) > 0.05 || Math.abs(moveZ) > 0.05;
        if (isMoving) {
          const speed = 7.0 * delta;
          chiikawaGroup.position.x += moveX * speed;
          chiikawaGroup.position.z += moveZ * speed;

          const targetAngle = Math.atan2(moveX, moveZ);
          chiikawaGroup.rotation.y = targetAngle;

          walkCycle += delta * 12;
          chiikawaGroup.position.y = Math.abs(Math.sin(walkCycle)) * 0.25;
          chiikawaGroup.rotation.z = Math.sin(walkCycle) * 0.08;
        } else {
          walkCycle += delta * 2.5;
          chiikawaGroup.position.y = Math.sin(walkCycle) * 0.05;
          chiikawaGroup.rotation.z = 0;
        }

        camera.position.x += (chiikawaGroup.position.x - camera.position.x) * 0.06;
        camera.position.z += (chiikawaGroup.position.z + 16 - camera.position.z) * 0.06;
        camera.lookAt(chiikawaGroup.position.x, 0, chiikawaGroup.position.z);

        checkProximity();
      }

      // 3D 物品旋轉浮動動畫 (星辰旋轉、風車轉動、水晶浮動)
      mapItemMeshes.forEach((itemGroup, idx) => {
        const cfg = MAP_ITEMS_CONFIG[idx];
        if (itemGroup.userData.mainMesh) {
          if (cfg.type === 'star') {
            itemGroup.userData.mainMesh.rotation.y += 0.03;
            itemGroup.userData.mainMesh.position.y = 0.8 + Math.sin(clock.getElapsedTime() * 3 + idx) * 0.12;
          } else if (cfg.type === 'crystal') {
            itemGroup.userData.mainMesh.rotation.y += 0.02;
            itemGroup.userData.mainMesh.position.y = 0.6 + Math.sin(clock.getElapsedTime() * 2.5 + idx) * 0.1;
          } else if (cfg.type === 'windmill') {
            itemGroup.userData.mainMesh.rotation.z += 0.04;
          } else if (cfg.type === 'bottle') {
            itemGroup.userData.mainMesh.rotation.y += 0.02;
            itemGroup.userData.mainMesh.position.y = 0.45 + Math.sin(clock.getElapsedTime() * 2 + idx) * 0.08;
          }
        }
      });

      renderer.render(scene, camera);
    }

    function checkProximity() {
      const prompt = document.getElementById('interact-prompt');
      const pText = document.getElementById('prompt-label-text');
      let nearAny = false;

      mapItemMeshes.forEach((itemGroup, idx) => {
        const dist = chiikawaGroup.position.distanceTo(itemGroup.position);
        if (dist < 2.3) {
          nearAny = true;
          activeItemIndex = idx;
          const cfg = MAP_ITEMS_CONFIG[idx];
          pText.innerText = `✨ 探索【${cfg.name}】！點擊開始挑戰`;
        }
      });

      if (nearAny && !isModalOpen) {
        prompt.style.display = 'flex';
      } else {
        prompt.style.display = 'none';
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

      updateKeyHUD();
      updateRemainingItemsLabel();

      window.addEventListener('pointerdown', () => initAudio(), { once: true });
    });
  </script>
</body>
